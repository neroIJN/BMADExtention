name: Release and Publish VS Code Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build, Package & Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Audit Extension Package Manifest
        run: npm run package:check

      - name: Build and Package Extension (.vsix)
        run: npm run package

      - name: Find Packaged VSIX
        id: get_vsix
        run: |
          VSIX_PATH=$(ls *.vsix | head -n 1)
          echo "vsix_file=$VSIX_PATH" >> $GITHUB_OUTPUT
          echo "Found package: $VSIX_PATH"

      - name: Create GitHub Release with VSIX
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.get_vsix.outputs.vsix_file }}
          generate_release_notes: true

      - name: Publish to VS Code Marketplace
        if: ${{ secrets.VSCE_PAT != '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx @vscode/vsce publish --packagePath ${{ steps.get_vsix.outputs.vsix_file }} -p $VSCE_PAT

      - name: Publish to Open VSX Registry (Optional)
        if: ${{ secrets.OVSX_PAT != '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          npx ovsx publish ${{ steps.get_vsix.outputs.vsix_file }} -p $OVSX_PAT
