name: Release and Publish VS Code Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build, Package & Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Build Extension
        run: npm run build

      - name: Audit Extension Package Manifest
        run: npm run package:check

      - name: Build and Package Extension (.vsix)
        run: |
          rm -f ./*.vsix
          npm run package

      - name: Find Packaged VSIX
        id: get_vsix
        run: |
          mapfile -t VSIX_FILES < <(ls -1 ./*.vsix 2>/dev/null || true)
          if [ "${#VSIX_FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one VSIX artifact, found ${#VSIX_FILES[@]}"
            ls -1 ./*.vsix 2>/dev/null || true
            exit 1
          fi
          VSIX_PATH="${VSIX_FILES[0]#./}"
          echo "vsix_file=$VSIX_PATH" >> $GITHUB_OUTPUT
          echo "Found package: $VSIX_PATH"

      - name: Inspect Packaged VSIX
        run: |
          npm run package:check:vsix -- "${{ steps.get_vsix.outputs.vsix_file }}"
          unzip -l "${{ steps.get_vsix.outputs.vsix_file }}"

      - name: Create GitHub Release with VSIX
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.get_vsix.outputs.vsix_file }}
          generate_release_notes: true

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: |
          npx @vscode/vsce publish --packagePath ${{ steps.get_vsix.outputs.vsix_file }} -p $VSCE_PAT

      - name: Publish to Open VSX Registry (Optional)
        if: env.OVSX_PAT != ''
        run: |
          npx ovsx publish ${{ steps.get_vsix.outputs.vsix_file }} -p $OVSX_PAT
